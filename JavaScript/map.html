<div class="map-section--map position-absolute">
    <script>
        // ✅ Official Google Maps Loader — no manual <script> tag
        (g => {
            var h, a, k, p = "The Google Maps JavaScript API",
                c = "google",
                l = "importLibrary",
                q = "__ib__",
                m = document,
                b = window;
            b = b[c] || (b[c] = {});
            var d = b.maps || (b.maps = {}),
                r = new Set(),
                e = new URLSearchParams(),
                u = () =>
                    h ||
                    (h = new Promise(async (f, n) => {
                        await (a = m.createElement("script"));
                        e.set("libraries", [...r] + "");
                        for (k in g)
                            e.set(k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()), g[k]);
                        e.set("callback", c + ".maps." + q);
                        a.src = `https://maps.googleapis.com/maps/api/js?` + e;
                        d[q] = f;
                        a.onerror = () => n(Error(p + " could not load."));
                        a.nonce = m.querySelector("script[nonce]")?.nonce || "";
                        m.head.append(a);
                    }));
            d[l]
                ? console.warn(p + " only loads once. Ignoring subsequent calls.")
                : (d[l] = (f, ...n) => (r.add(f), u().then(() => d[l](f, ...n))));
        })({
            key: "",
            v: "weekly",
        });

        // ✅ Initialize map
        async function initMap() {
            const { Map } = await google.maps.importLibrary("maps");
            const { AdvancedMarkerElement } = await google.maps.importLibrary("marker");

            const position = { lat: 53.38666753036168, lng: -2.9803491280172505 };

            const map = new Map(document.getElementById("map1"), {
                center: position,
                zoom: 16,
                mapId: "",
                mapTypeControl: false,
                streetViewControl: false,
                fullscreenControl: false,

            });

            // ✅ Custom SVG marker
            const iconImg = document.createElement("img");
            iconImg.src = "/wp-content/uploads/2023/12/sm-map-icon.svg";
            iconImg.style.width = "40px";
            iconImg.style.height = "40px";

            new AdvancedMarkerElement({
                map,
                position,
                content: iconImg,
                title: "Our Location",
            });
        }

        // Run once loaded
        window.addEventListener("load", initMap);
    </script>

    <div id="map1" class="map"></div>
</div>
